<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FretWise</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>FretWise</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tuner">Tuner</button>
      <button class="tab-btn" data-tab="drill">Fretboard Drill</button>
      <button class="tab-btn" data-tab="timing" disabled title="Coming soon">Timing Trainer</button>
      <button class="tab-btn" data-tab="log" disabled title="Coming soon">Practice Log</button>
    </nav>
  </header>

  <main>
    <section id="tuner-view" class="view active">
      <div class="instrument-select" id="instrument-select">
        <button class="instrument-btn active" data-instrument="guitar">Guitar</button>
        <button class="instrument-btn" data-instrument="bass">Bass</button>
      </div>

      <div class="mic-controls">
        <button id="mic-toggle" class="primary-btn">Start Tuner</button>
        <p id="mic-status" class="status-text">Microphone off</p>
      </div>

      <div class="tuner-display" id="tuner-display">
        <div class="note-name" id="note-name">&#8211;&#8211;</div>
        <div class="frequency" id="frequency">0.0 Hz</div>

        <div class="cents-meter">
          <div class="cents-scale">
            <span>&minus;50</span>
            <span>0</span>
            <span>+50</span>
          </div>
          <div class="cents-track">
            <div class="cents-center-line"></div>
            <div class="cents-needle" id="cents-needle"></div>
          </div>
          <div class="cents-value" id="cents-value">0 cents</div>
        </div>
      </div>

      <div class="string-reference" id="string-reference"></div>
    </section>

    <section id="drill-view" class="view">
      <div class="instrument-select" id="drill-instrument-select">
        <button class="instrument-btn active" data-instrument="guitar">Guitar</button>
        <button class="instrument-btn" data-instrument="bass">Bass</button>
      </div>

      <fieldset class="drill-settings" id="drill-settings">
        <legend>Drill settings</legend>
        <div class="string-picker" id="drill-string-picker"></div>
        <div class="fret-range-picker">
          <label><input type="radio" name="fret-range" value="5" checked /> Frets 0-5</label>
          <label><input type="radio" name="fret-range" value="12" /> Frets 0-12</label>
        </div>
      </fieldset>

      <div class="mic-controls">
        <button id="drill-toggle" class="primary-btn">Start Drill</button>
        <p id="drill-status" class="status-text">Microphone off</p>
      </div>

      <div class="drill-prompt" id="drill-prompt">Press Start Drill to begin</div>
      <div class="drill-feedback" id="drill-feedback"></div>

      <div class="fretboard" id="fretboard"></div>

      <div class="drill-footer">
        <div class="drill-score" id="drill-score">Score: 0 / 0</div>
        <button id="drill-skip" class="secondary-btn">Skip</button>
      </div>
    </section>
  </main>

  <script src="js/pitch-detect.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tuner.js"></script>
  <script src="js/drill.js"></script>
</body>
</html>
